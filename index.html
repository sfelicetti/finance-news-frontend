<!DOCTYPE html>
<html>
<head>
  <title>Global Finance Dashboard</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #121212;
      color: white;
    }

    header {
      background: #1f1f1f;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 15px;
    }

    button, select {
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #333;
      color: white;
    }

    button.active {
      background: red;
    }

    #news {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 15px;
      padding: 20px;
      list-style: none;
    }

    li {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      position: relative;
      transition: transform 0.2s;
    }

    li:hover {
      transform: translateY(-5px);
    }

    li.important {
      border-left: 5px solid red;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: red;
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 3px;
    }

    .category {
      font-size: 11px;
      color: #aaa;
    }

    .source {
      font-size: 11px;
      color: #66ccff;
      margin-bottom: 5px;
    }

    .score {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    small {
      color: gray;
    }
  </style>
</head>

<body>

<header>📊 Global Finance Dashboard</header>

<div class="controls">
  <button onclick="setFilter('all')" id="btnAll" class="active">All</button>
  <button onclick="setFilter('important')" id="btnImportant">Important</button>
  <button onclick="setFilter('defense')" id="btnDefense">Defense</button>
  <button onclick="setFilter('ai')" id="btnAi">AI</button>
  <button onclick="setFilter('semiconductor')" id="btnSemiconductor">Semiconductors</button>
  <button onclick="setFilter('macro')" id="btnMacro">Macro</button>

  <!-- ✅ NUOVO FILTRO -->
  <select id="sourceFilter" onchange="setSourceFilter()">
    <option value="all">All Sources</option>
  </select>
</div>

<ul id="news"></ul>

<script>
let allNews = [];
let currentFilter = "all";
let currentSource = "all";

const scoreColors = {
  5: "#ff0000",
  4: "#ff6600",
  3: "#ffaa00",
  2: "#3399ff",
  1: "#666"
};

const categoryLabels = {
  defense: "Defense",
  ai: "AI",
  semiconductor: "Semiconductors",
  macro: "Macro",
  general: "General"
};

async function loadNews() {
  const res = await fetch("https://finance-news-backend-3dbp.onrender.com/news?t=" + Date.now());
  const data = await res.json();

  allNews = data;

  populateSources();
  renderNews();
}

function populateSources() {
  const select = document.getElementById("sourceFilter");

  const sources = [...new Set(allNews.map(n => n.source))];

  select.innerHTML = '<option value="all">All Sources</option>';

  sources.forEach(src => {
    const opt = document.createElement("option");
    opt.value = src;
    opt.textContent = src;
    select.appendChild(opt);
  });
}

function renderNews() {
  const list = document.getElementById("news");
  list.innerHTML = "";

  let filtered = allNews;

  if (currentFilter === "important") {
    filtered = filtered.filter(n => n.important);
  } else if (currentFilter !== "all") {
    filtered = filtered.filter(n => n.category === currentFilter);
  }

  if (currentSource !== "all") {
    filtered = filtered.filter(n => n.source === currentSource);
  }

  filtered.forEach(article => {
    const li = document.createElement("li");

    if (article.important) {
      li.classList.add("important");

      const badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = "IMPORTANT";
      li.appendChild(badge);
    }

    const category = document.createElement("div");
    category.className = "category";
    category.textContent = categoryLabels[article.category] || "General";

    const source = document.createElement("div");
    source.className = "source";
    source.textContent = article.source;

    const link = document.createElement("a");
    link.href = article.link;
    link.target = "_blank";
    link.textContent = article.title;

    const date = document.createElement("div");
    date.innerHTML = "<small>" + new Date(article.pubDate).toLocaleString() + "</small>";

    const score = document.createElement("div");
    score.className = "score";
    score.style.background = scoreColors[article.score];
    score.textContent = article.score;

    li.appendChild(category);
    li.appendChild(source);
    li.appendChild(link);
    li.appendChild(document.createElement("br"));
    li.appendChild(date);
    li.appendChild(score);

    list.appendChild(li);
  });
}

function setFilter(filter) {
  currentFilter = filter;

  document.querySelectorAll("button").forEach(btn => btn.classList.remove("active"));
  document.getElementById("btn" + filter.charAt(0).toUpperCase() + filter.slice(1))?.classList.add("active");

  renderNews();
}

function setSourceFilter() {
  currentSource = document.getElementById("sourceFilter").value;
  renderNews();
}

setInterval(loadNews, 300000);

loadNews();
</script>

</body>
</html>
