<!DOCTYPE html>
<html>
<head>
  <title>Finance Dashboard</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #121212;
      color: white;
    }

    header {
      background: #1f1f1f;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 15px;
    }

    button {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #333;
      color: white;
    }

    button.active {
      background: red;
    }

    #news {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 15px;
      padding: 20px;
      list-style: none;
    }

    li {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      position: relative;
      transition: transform 0.2s;
    }

    li:hover {
      transform: translateY(-5px);
    }

    li.important {
      border-left: 5px solid red;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: red;
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 3px;
    }

    .category {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 5px;
    }

    .score {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    small {
      color: gray;
    }
  </style>

</head>
<body>

<header>📊 Finance News Dashboard</header>

<div class="controls">
  <button onclick="setFilter('all')" id="btnAll" class="active">Tutte</button>
  <button onclick="setFilter('important')" id="btnImp">Importanti</button>
  <button onclick="setFilter('defense')" id="btnDef">Difesa</button>
  <button onclick="setFilter('ai')" id="btnAI">AI</button>
  <button onclick="setFilter('semiconductor')" id="btnSemi">Chip</button>
  <button onclick="setFilter('macro')" id="btnMacro">Macro</button>
</div>

<ul id="news"></ul>

<script>
let allNews = [];
let currentFilter = "all";

const scoreColors = {
  5: "#ff0000",
  4: "#ff6600",
  3: "#ffaa00",
  2: "#3399ff",
  1: "#666"
};

async function loadNews() {
  const res = await fetch("https://finance-news-backend-3dbp.onrender.com/news?t=" + Date.now());
  const data = await res.json();

  allNews = data;
  renderNews();
}

function renderNews() {
  const list = document.getElementById("news");
  list.innerHTML = "";

  let filtered = allNews;

  if (currentFilter === "important") {
    filtered = allNews.filter(n => n.important);
  } else if (currentFilter !== "all") {
    filtered = allNews.filter(n => n.category === currentFilter);
  }

  filtered.forEach(article => {
    const li = document.createElement("li");

    // important badge
    if (article.important) {
      li.classList.add("important");

      const badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = "IMPORTANT";
      li.appendChild(badge);
    }

    // category
    const category = document.createElement("div");
    category.className = "category";
    category.textContent = article.category.toUpperCase();

    // link
    const link = document.createElement("a");
    link.href = article.link;
    link.target = "_blank";
    link.textContent = article.title;

    // date
    const date = document.createElement("div");
    date.innerHTML = "<small>" + new Date(article.pubDate).toLocaleString() + "</small>";

    // score
    const score = document.createElement("div");
    score.className = "score";
    score.style.background = scoreColors[article.score];
    score.textContent = article.score;

    li.appendChild(category);
    li.appendChild(link);
    li.appendChild(document.createElement("br"));
    li.appendChild(date);
    li.appendChild(score);

    list.appendChild(li);
  });
}

function setFilter(filter) {
  currentFilter = filter;

  document.querySelectorAll("button").forEach(btn => btn.classList.remove("active"));

  if (filter === "all") btnAll.classList.add("active");
  if (filter === "important") btnImp.classList.add("active");
  if (filter === "defense") btnDef.classList.add("active");
  if (filter === "ai") btnAI.classList.add("active");
  if (filter === "semiconductor") btnSemi.classList.add("active");
  if (filter === "macro") btnMacro.classList.add("active");

  renderNews();
}

// auto refresh
setInterval(loadNews, 300000);

loadNews();
</script>

</body>
</html>
