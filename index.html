<!DOCTYPE html> 
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard PRO</title>

<style>
body { font-family: Arial; background:#121212; color:white; margin:0;}
header{padding:15px;text-align:center;background:#1f1f1f;font-weight:bold;}

.controls{display:flex;flex-wrap:wrap;gap:8px;padding:10px;justify-content:center;}
button{padding:6px 10px;background:#333;color:white;border:none;border-radius:5px;cursor:pointer;}
button.active{background:red;}

.sourceBox{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;}
.sourceItem{padding:5px 8px;border-radius:5px;background:#444;cursor:pointer;font-size:12px;}
.sourceItem.active{background:#00cc99;}

#news{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px;padding:15px;}

li{background:#1e1e1e;padding:12px;border-radius:10px;position:relative;}
.important{border-left:5px solid red;}

.score{position:absolute;bottom:8px;right:8px;padding:3px 6px;border-radius:4px;}
.ticker{color:#00ffcc;font-size:12px;}
.sentiment.pos{color:#00ff00;}
.sentiment.neg{color:#ff4444;}
.sentiment.neu{color:#aaa;}

</style>
</head>

<body>

<header>📊 Finance Dashboard PRO</header>

<div class="controls">
<button onclick="setFilter('all')" class="active" id="btnAll">All</button>
<button onclick="setFilter('ai')">AI</button>
<button onclick="setFilter('defense')">Defense</button>
<button onclick="setFilter('macro')">Macro</button>
</div>

<div id="sources" class="sourceBox"></div>

<ul id="news"></ul>

<script>
let allNews=[];
let currentFilter="all";
let selectedSources=[];

async function loadNews(){
 const res=await fetch("https://finance-news-backend-3dbp.onrender.com/news?t="+Date.now());
 allNews=await res.json();
 buildSources();
 renderNews();
}

function buildSources(){
 const box=document.getElementById("sources");
 const sources=[...new Set(allNews.map(n=>n.source))];

 box.innerHTML="";

 sources.forEach(src=>{
   const div=document.createElement("div");
   div.className="sourceItem";
   div.textContent=src;

   div.onclick=()=>{
     if(selectedSources.includes(src)){
       selectedSources=selectedSources.filter(s=>s!==src);
       div.classList.remove("active");
     }else{
       selectedSources.push(src);
       div.classList.add("active");
     }
     renderNews();
   };

   box.appendChild(div);
 });
}

function renderNews(){
 let list=document.getElementById("news");
 list.innerHTML="";

 let filtered=allNews;

 if(currentFilter!=="all"){
   filtered=filtered.filter(n=>n.category===currentFilter);
 }

 if(selectedSources.length>0){
   filtered=filtered.filter(n=>selectedSources.includes(n.source));
 }

 filtered.forEach(a=>{
   let li=document.createElement("li");

   if(a.important) li.classList.add("important");

   let sentimentClass = a.sentiment==="positive" ? "pos" :
                        a.sentiment==="negative" ? "neg" : "neu";

   li.innerHTML=`
     <div>${a.source}</div>
     <div class="ticker">${a.ticker || ""}</div>
     <a href="${a.title}</a>
     <div class="sentiment ${sentimentClass}">${a.sentiment}</div>
   `;

   list.appendChild(li);
 });
}

function setFilter(f){
 currentFilter=f;
 document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
 document.getElementById("btn"+f.charAt(0).toUpperCase()+f.slice(1))?.classList.add("active");
 renderNews();
}

setInterval(loadNews,300000);
loadNews();
</script>

</body>
</html>
