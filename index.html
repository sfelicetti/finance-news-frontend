<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard</title>

<style>
body { background:#121212; color:white; font-family:Arial; margin:0;}
header{padding:15px; text-align:center; background:#1f1f1f;}

.sourceBox{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:10px;}
.sourceItem{padding:5px 8px;background:#444;border-radius:5px;cursor:pointer;font-size:12px;}
.sourceItem.active{background:#00cc99;}

#news{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px;padding:15px;}

li{background:#1e1e1e;padding:10px;border-radius:10px;}
a{color:white;text-decoration:none;}

.ticker{color:#00ffcc;font-size:12px;}
.pos{color:#00ff00;}
.neg{color:#ff4444;}
.neu{color:#aaa;}
</style>
</head>

<body>

<header>📊 Finance Dashboard</header>

<div id="sources" class="sourceBox"></div>
<ul id="news"></ul>

<script>
let allNews=[];
let selectedSources=[];

async function loadNews(){
 const res=await fetch("https://finance-news-backend-3dbp.onrender.com/news?t="+Date.now());
 allNews=await res.json();
 buildSources();
 renderNews();
}

function buildSources(){
 const box=document.getElementById("sources");
 const sources=[...new Set(allNews.map(n=>n.source))];

 box.innerHTML="";

 sources.forEach(src=>{
  const div=document.createElement("div");
  div.className="sourceItem";
  div.textContent=src;

  div.onclick=()=>{
    if(selectedSources.includes(src)){
      selectedSources=selectedSources.filter(s=>s!==src);
      div.classList.remove("active");
    }else{
      selectedSources.push(src);
      div.classList.add("active");
    }
    renderNews();
  };

  box.appendChild(div);
 });
}

function renderNews(){
 const list=document.getElementById("news");
 list.innerHTML="";

 let filtered=allNews;

 if(selectedSources.length>0){
  filtered=filtered.filter(n=>selectedSources.includes(n.source));
 }

 filtered.forEach(a=>{
  const li=document.createElement("li");

  const sentimentClass =
    a.sentiment==="positive" ? "pos" :
    a.sentiment==="negative" ? "neg" : "neu";

  li.innerHTML = `
    <div>${a.source}</div>
    <div class="ticker">${a.ticker ? "["+a.ticker+"]" : ""}</div>
    ${a.link}${a.title}</a>
    <div class="${sentimentClass}">${a.sentiment}</div>
  `;

  list.appendChild(li);
 });
}

setInterval(loadNews,300000);
loadNews();
</script>

</body>
</html>
