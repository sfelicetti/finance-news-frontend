<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard</title>

<style>
body {background:#121212;color:white;font-family:Arial;margin:0;}
header{padding:15px;text-align:center;background:#1f1f1f;}

.controls{display:flex;gap:6px;justify-content:center;padding:10px;flex-wrap:wrap;}
button{padding:6px 10px;background:#333;color:white;border:none;border-radius:5px;}
button.active{background:red;}

.sourceBox{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:10px;}
.sourceItem{background:#444;padding:5px;border-radius:5px;cursor:pointer;}
.sourceItem.active{background:#00cc99;}

#news{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:10px;}

li{background:#1e1e1e;padding:10px;border-radius:10px;}
a{color:white;text-decoration:none;}
</style>
</head>

<body>

<header>📊 Finance Dashboard</header>

<div class="controls">
<button onclick="setFilter('all')" id="btnall" class="active">All</button>
<button onclick="setFilter('ai')">AI</button>
<button onclick="setFilter('semiconductor')">Semiconductors</button>
<button onclick="setFilter('defense')">Defense</button>
<button onclick="setFilter('macro')">Macro</button>
</div>

<div id="sources" class="sourceBox"></div>

<ul id="news"></ul>

<script>
let allNews = [];
let currentFilter = "all";
let selectedSources = [];

async function loadNews(){
  const res = await fetch("https://finance-news-backend-3dbp.onrender.com/news");
  allNews = await res.json();

  buildSources();
  renderNews();
}

function buildSources(){
  const box = document.getElementById("sources");
  box.innerHTML = "";

  const sources = [...new Set(allNews.map(n => n.source))];

  sources.forEach(src => {
    const div = document.createElement("div");
    div.className = "sourceItem";
    div.textContent = src;

    div.onclick = () => {
      if (selectedSources.includes(src)) {
        selectedSources = selectedSources.filter(s => s !== src);
        div.classList.remove("active");
      } else {
        selectedSources.push(src);
        div.classList.add("active");
      }
      renderNews();
    };

    box.appendChild(div);
  });
}

function renderNews(){
  const list = document.getElementById("news");
  list.innerHTML = "";

  let filtered = allNews;

  if (currentFilter !== "all") {
    filtered = filtered.filter(n =>
      (n.category || "").toLowerCase() === currentFilter
    );
  }

  if (selectedSources.length > 0) {
    filtered = filtered.filter(n => selectedSources.includes(n.source));
  }

  if (filtered.length === 0) {
    list.innerHTML = "<li>Nessuna news trovata</li>";
    return;
  }

  filtered.forEach(n => {
    const li = document.createElement("li");

    li.innerHTML = `
      <div>${n.source}</div>
      <a href="${n.link}"</a>
    `;

    list.appendChild(li);
  });
}

function setFilter(f){
  currentFilter = f;

  document.querySelectorAll("button").forEach(b => b.classList.remove("active"));

  const btn = document.querySelector(`button[onclick="setFilter('${f}')"]`);
  if (btn) btn.classList.add("active");

  renderNews();
}

loadNews();
setInterval(loadNews, 300000);
</script>

</body>
</html>
