<!DOCTYPE html>
<html>
<head>
  <title>Finance News</title>
  <style>
    body {
      font-family: Arial;
      margin: 40px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    li {
      margin-bottom: 10px;
    }
    a {
      text-decoration: none;
      color: #0077cc;
    }
  </style>
</head>
<body>

<h1>Ultime notizie finanziarie</h1>

<ul id="news"></ul>

<script>
async function loadNews() {
  const res = await fetch("https://finance-news-backend-3dbp.onrender.com/news?t=" + Date.now());
  const data = await res.json();

  const list = document.getElementById("news");

  data.forEach(article => {
    const li = document.createElement("li");

if (article.important) {
  li.style.backgroundColor = "#ffe6e6"; // rosso leggero
  li.style.borderLeft = "5px solid red";
  li.style.padding = "10px";
}

const link = document.createElement("a");
link.href = article.link;
link.target = "_blank";
link.textContent = article.title;

const date = document.createElement("div");
date.innerHTML = "<small>" + new Date(article.pubDate).toLocaleString() + "</small>";

li.appendChild(link);
li.appendChild(document.createElement("br"));
li.appendChild(date);

list.appendChild(li);

    
li.innerHTML = `
  <a href="${article.link}" target="_blank">
    ${article.title}
  </a>
  <br/>
  <small>${new Date(article.pubDate).toLocaleString()}</small>
`;


    list.appendChild(li);
  });
}

loadNews();
</script>

</body>
</html>
